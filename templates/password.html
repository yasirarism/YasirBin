{{template "head" .}}
<div class="flex items-center justify-center h-screen bg-primary text-primary">
<form method="post" action="/{{.Slug}}" class="p-8 bg-secondary rounded-lg shadow-lg">
<h1 class="text-2xl font-bold mb-4">Password Protected</h1>
<p class="mb-4">This paste is password protected. Please enter the password to view it.</p>
{{if .Error}}<p class="text-destructive mb-4">{{.Error}}</p>{{end}}
<div class="mb-4">
<label for="password" class="block mb-2">Password</label>
<input type="password" name="password" id="password" class="w-full px-3 py-2 rounded bg-primary text-primary" required="true">
</div>
<button type="submit" class="w-full bg-accent hover:bg-opacity-80 text-accent font-bold py-2 px-4 rounded">Unlock</button>
</form>
</div>
{{template "scripts" .}}
</body>
</html>
